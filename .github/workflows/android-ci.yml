name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          mkdir -p "$SDK_DIR/licenses"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Pre-cache Robolectric SDK artifact from Google mirror
        run: |
          M2_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          JAR_NAME="android-all-instrumented-16-robolectric-13921718-i7.jar"
          POM_NAME="android-all-instrumented-16-robolectric-13921718-i7.pom"
          BASE_URL="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          mkdir -p "$M2_DIR"
          if [ ! -f "$M2_DIR/$JAR_NAME" ]; then
            curl -fsSL --retry 2 --connect-timeout 15 "$BASE_URL/$JAR_NAME" -o "$M2_DIR/$JAR_NAME" || rm -f "$M2_DIR/$JAR_NAME"
          fi
          if [ ! -f "$M2_DIR/$POM_NAME" ]; then
            curl -fsSL --retry 2 --connect-timeout 15 "$BASE_URL/$POM_NAME" -o "$M2_DIR/$POM_NAME" || rm -f "$M2_DIR/$POM_NAME"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest -PskipEmulatorTests=true --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionShield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
